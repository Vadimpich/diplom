services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diplom}
      POSTGRES_USER: ${POSTGRES_USER:-diplom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diplom_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-diplom}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-diplom_dev_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics check_running && rabbitmq-diagnostics check_port_listener 5672",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-diplom-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-diplom_minio_dev_password}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  wimi:
    build:
      context: ./wimi-server
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8081/Models >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      wimi:
        condition: service_healthy
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-diplom}:${POSTGRES_PASSWORD:-diplom_dev_password}@postgres:5432/${POSTGRES_DB:-diplom}?sslmode=${DATABASE_SSLMODE:-disable}

      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-diplom}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-diplom_dev_password}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://diplom:diplom_dev_password@rabbitmq:5672/}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-diplom-minio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-diplom_minio_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-diplom-audio}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      BASELINE_SERVICE_URL: ${BASELINE_SERVICE_URL:-http://ml-baseline:8080}
      KESMI_BASE_URL: ${KESMI_BASE_URL:-http://wimi:8081}
      KESMI_MODEL_ID: ${KESMI_MODEL_ID:-stub-decision-model}
      KESMI_TIMEOUT_MS: ${KESMI_TIMEOUT_MS:-1000ms}
      KESMI_MAX_RETRIES: ${KESMI_MAX_RETRIES:-2}
      KESMI_RETRY_BACKOFF_MS: ${KESMI_RETRY_BACKOFF_MS:-500ms}

      JWT_ISSUER: ${JWT_ISSUER:-diplom}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      INITIAL_USER_LOGIN: ${INITIAL_USER_LOGIN:-operator}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-operator123}
      INITIAL_USER_ROLE: ${INITIAL_USER_ROLE:-operator}
    ports:
      - "${CORE_BACKEND_HOST_PORT:-8080}:${CORE_BACKEND_PORT:-8080}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${CORE_BACKEND_PORT:-8080}/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      core-backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://core-backend:8080}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      core-backend:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  text-worker:
    build:
      context: ./ml-services/ml-text
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      WORKER_APP_NAME: ${TEXT_WORKER_APP_NAME:-text-worker}
      WORKER_PORT: ${TEXT_WORKER_PORT:-8080}
      WORKER_QUEUE_NAME: ${TEXT_WORKER_QUEUE_NAME:-qq.processing.text}
      WORKER_COMMAND_ROUTING_KEY: ${TEXT_WORKER_COMMAND_ROUTING_KEY:-processing.command.text}
      WORKER_COMMAND_EXCHANGE: ${PROCESSING_COMMAND_EXCHANGE:-processing.commands}
      WORKER_RESULT_EXCHANGE: ${PROCESSING_RESULT_EXCHANGE:-processing.results}
      WORKER_RESULT_ROUTING_KEY: ${PROCESSING_RESULT_ROUTING_KEY:-processing.result}
      WORKER_PREFETCH_COUNT: ${WORKER_PREFETCH_COUNT:-1}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-diplom}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-diplom_dev_password}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-diplom-minio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-diplom_minio_dev_password}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  acoustic-worker:
    build:
      context: ./ml-services/ml-acoustic
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      WORKER_APP_NAME: ${ACOUSTIC_WORKER_APP_NAME:-acoustic-worker}
      WORKER_PORT: ${ACOUSTIC_WORKER_PORT:-8080}
      WORKER_QUEUE_NAME: ${ACOUSTIC_WORKER_QUEUE_NAME:-qq.processing.acoustic}
      WORKER_COMMAND_ROUTING_KEY: ${ACOUSTIC_WORKER_COMMAND_ROUTING_KEY:-processing.command.acoustic}
      WORKER_COMMAND_EXCHANGE: ${PROCESSING_COMMAND_EXCHANGE:-processing.commands}
      WORKER_RESULT_EXCHANGE: ${PROCESSING_RESULT_EXCHANGE:-processing.results}
      WORKER_RESULT_ROUTING_KEY: ${PROCESSING_RESULT_ROUTING_KEY:-processing.result}
      WORKER_PREFETCH_COUNT: ${WORKER_PREFETCH_COUNT:-1}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-diplom}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-diplom_dev_password}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-diplom-minio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-diplom_minio_dev_password}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  paralinguistic-worker:
    build:
      context: ./ml-services/ml-paralinguistic
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      WORKER_APP_NAME: ${PARALINGUISTIC_WORKER_APP_NAME:-paralinguistic-worker}
      WORKER_PORT: ${PARALINGUISTIC_WORKER_PORT:-8080}
      WORKER_QUEUE_NAME: ${PARALINGUISTIC_WORKER_QUEUE_NAME:-qq.processing.paralinguistic}
      WORKER_COMMAND_ROUTING_KEY: ${PARALINGUISTIC_WORKER_COMMAND_ROUTING_KEY:-processing.command.paralinguistic}
      WORKER_COMMAND_EXCHANGE: ${PROCESSING_COMMAND_EXCHANGE:-processing.commands}
      WORKER_RESULT_EXCHANGE: ${PROCESSING_RESULT_EXCHANGE:-processing.results}
      WORKER_RESULT_ROUTING_KEY: ${PROCESSING_RESULT_ROUTING_KEY:-processing.result}
      WORKER_PREFETCH_COUNT: ${WORKER_PREFETCH_COUNT:-1}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-diplom}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-diplom_dev_password}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-diplom-minio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-diplom_minio_dev_password}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ml-baseline:
    build:
      context: ./ml-services/ml-baseline
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BASELINE_HTTP_HOST: ${BASELINE_HTTP_HOST:-0.0.0.0}
      BASELINE_HTTP_PORT: ${BASELINE_HTTP_PORT:-8080}
      BASELINE_REQUEST_TIMEOUT_MS: ${BASELINE_REQUEST_TIMEOUT_MS:-3000}
      BASELINE_ALGORITHM_VERSION: ${BASELINE_ALGORITHM_VERSION:-baseline-v1}
      BASELINE_MAX_HISTORY: ${BASELINE_MAX_HISTORY:-5}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BASELINE_HTTP_PORT:-8080}/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
