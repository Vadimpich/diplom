global:
  scrape_interval: 15s

scrape_configs:
  - job_name: core-backend
    static_configs:
      - targets: ["core-backend:8080"]

  - job_name: frontend
    metrics_path: /api/metrics
    static_configs:
      - targets: ["frontend:3000"]

  - job_name: text-worker
    static_configs:
      - targets: ["text-worker:8080"]

  - job_name: acoustic-worker
    static_configs:
      - targets: ["acoustic-worker:8080"]

  - job_name: paralinguistic-worker
    static_configs:
      - targets: ["paralinguistic-worker:8080"]

  - job_name: ml-baseline
    static_configs:
      - targets: ["ml-baseline:8080"]
